apiVersion: v1
kind: Namespace
metadata:
  name: sql-easy-where
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sql-easy-where
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sql-easy-where
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: sql-easy-where
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal
  namespace: sql-easy-where
spec:
  rules:
    - host: internal.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
