apiVersion: v1
kind: Namespace
metadata:
  name: sql-hard-metrics
---
apiVersion: v1
kind: Pod
metadata:
  name: measure
  namespace: sql-hard-metrics
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 128Mi
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 128Mi
