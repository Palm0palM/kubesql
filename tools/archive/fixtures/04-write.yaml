apiVersion: v1
kind: Namespace
metadata:
  name: sql-medium-write
  annotations:
    owner: before
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sql-medium-write
  annotations:
    keep: unchanged
spec:
  replicas: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: sql-medium-write
spec:
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: sql-medium-write
spec:
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporary
  namespace: sql-medium-write
spec:
  defaultBackend:
    service:
      name: web
      port:
        number: 80
