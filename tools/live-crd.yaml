apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: notes.live.ksql.example.com
spec:
  group: live.ksql.example.com
  scope: Namespaced
  names:
    plural: notes
    singular: note
    kind: DemoNote
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [size]
              properties:
                size:
                  type: integer
                  format: int64
                  minimum: 1
                optional:
                  type: string
                  nullable: true
