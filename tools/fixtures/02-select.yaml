apiVersion: v1
kind: Namespace
metadata:
  name: sql-easy-select
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sql-easy-select
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: sql-easy-select
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: sql-easy-select
spec:
  defaultBackend:
    service:
      name: web
      port:
        number: 80
