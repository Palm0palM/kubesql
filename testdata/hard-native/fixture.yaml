apiVersion: v1
kind: Namespace
metadata:
  name: sql-hard-native
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: sql-hard-native
  annotations:
    test.example.com/before: preserved
data:
  mode: dev
---
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  namespace: sql-hard-native
type: Opaque
stringData:
  username: demo
  password: not-a-real-secret
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-rs
  namespace: sql-hard-native
spec:
  replicas: 0
  selector:
    matchLabels:
      app: web-rs
  template:
    metadata:
      labels:
        app: web-rs
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: sql-hard-native
spec:
  clusterIP: None
  selector:
    app: cache
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: sql-hard-native
spec:
  serviceName: cache
  replicas: 0
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: nginx:1.27
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: sql-hard-native
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
